name: Continuous Integration

on:
  push:
    branches:
      - main
      - feature/develop
  pull_request:
    branches:
      - main
      - feature/develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Typecheck
    runs-on: [self-hosted, windows]

    defaults:
      run:
        shell: cmd
        working-directory: app/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck and compile backend
        run: npm run build

  frontend:
    name: Frontend Build & Typecheck
    runs-on: [self-hosted, windows]

    defaults:
      run:
        shell: cmd
        working-directory: app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build production bundle
        run: npm run build

  docker:
    name: Docker Container Validation
    runs-on: [self-hosted, windows]

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t stroke-rehab-backend:ci ./app/backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t stroke-rehab-frontend:ci ./app/frontend

      - name: Clean up CI Docker Images
        if: always()
        run: |
          docker rmi -f stroke-rehab-backend:ci stroke-rehab-frontend:ci

  ci-check:
    name: CI Status Check
    runs-on: [self-hosted, windows]
    needs: [backend, frontend, docker]
    if: always()

    defaults:
      run:
        shell: cmd

    steps:
      - name: Verify all jobs succeeded
        run: |
          @echo off
          setlocal
          set B=${{ needs.backend.result }}
          set F=${{ needs.frontend.result }}
          set D=${{ needs.docker.result }}
          echo Job status: backend=%B%, frontend=%F%, docker=%D%
          if not "%B%"=="success" goto fail
          if not "%F%"=="success" goto fail
          if not "%D%"=="success" goto fail
          echo All CI jobs passed successfully on the Windows self-hosted runner!
          exit /b 0
          :fail
          echo One or more CI jobs failed.
          exit /b 1
